image:
  repository: ghcr.io/2pk03/kaf-s3-connector
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# The metrics port. Used for the Service, the container port, both probes, the
# scrape annotation, and the app's METRICS_PORT - do not set METRICS_PORT in env.
service:
  type: ClusterIP
  port: 8000

# Non-sensitive settings. Rendered into the Deployment in plain text.
env:
  MODE: consumer
  TOPIC: large-messages-topic
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  KAFKA_GROUP_ID: my-s3-consumers
  S3_BUCKET: my-large-messages-bucket

# Secrets (KAFKA_SASL_PASSWORD, KAFKA_SSL_KEY_PASSWORD, ...) belong in a Secret,
# not in values. List the Secret or ConfigMap names to load them from.
envFrom: []
  # - secretRef:
  #     name: kaf-s3-kafka-credentials

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
