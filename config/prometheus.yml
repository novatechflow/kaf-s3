global:
  scrape_interval: 15s

scrape_configs:
  # Static target, e.g. for docker-compose where the service is named "app".
  - job_name: kaf-s3-connector
    static_configs:
      - targets:
          - "app:8000"

  # Kubernetes: discovers pods carrying the annotations set by the Helm chart.
  - job_name: kaf-s3-connector-k8s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kaf-s3-connector
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
