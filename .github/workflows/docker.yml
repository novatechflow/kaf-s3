name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kaf-s3-connector:latest
            ghcr.io/${{ github.repository_owner }}/kaf-s3-connector:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kaf-s3-connector:${{ github.sha }}
