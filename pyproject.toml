[build-system]
requires = ["setuptools>=61,<75", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaf-s3-connector"
dynamic = ["version"]
description = "A Python library to handle large Kafka messages using S3."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "2pk03"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.20.0",
    "confluent-kafka>=1.8.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-mock>=3",
]
integration = [
    "pytest>=7",
    "pytest-mock>=3",
    "testcontainers[kafka,minio]>=4.8",
]

[project.scripts]
kaf-s3-connector = "s3_connector.runtime:run"

[project.urls]
Homepage = "https://github.com/2pk03/kaf-s3"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/s3_connector/_version.py"
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Docker; runs against a real Kafka broker and a real S3 service",
]
# Integration tests are opt-in so the default run stays fast and Docker-free.
# Run them with: pytest -m integration
addopts = "-m 'not integration'"
