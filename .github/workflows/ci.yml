name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install ".[test]"
      - name: Run tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install ".[integration]"
      - name: Run integration tests
        run: pytest -m integration -v --tb=short -ra

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build image
        run: docker build -t kaf-s3-connector:ci .
      - name: Entrypoint smoke test
        run: |
          docker run --rm -d --name kaf-s3-ci -p 8000:8000 \
            -e MODE=consumer \
            -e TOPIC=ci-topic \
            -e KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
            -e KAFKA_GROUP_ID=ci-group \
            -e S3_BUCKET=ci-bucket \
            kaf-s3-connector:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/metrics >/dev/null; then
              echo "metrics endpoint is up"
              docker rm -f kaf-s3-ci
              exit 0
            fi
            sleep 1
          done
          echo "metrics endpoint never came up"
          docker logs kaf-s3-ci
          docker rm -f kaf-s3-ci
          exit 1

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint charts/kaf-s3-connector
      - name: Render chart
        run: helm template kaf-s3 charts/kaf-s3-connector > /dev/null
